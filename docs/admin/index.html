러나 내 종 갈렙은 그 마음이 그들과 달라서 나를 온전히 따랐은즉 그가 갔던 땅으로 내가 그를 인도하여 들이리니 그 자손이 그 땅을 차지하리라.\",\"title\":\"마음을 다해 주님을 따르는 하루\",\"meditation\":\"갈렙은 상황이 쉬워서가 아니라 하나님을 신뢰했기 때문에 다른 마음을 품을 수 있었습니다. 믿음은 많은 사람이 가는 길을 무작정 따르는 것이 아니라, 하나님의 약속을 붙들고 끝까지 순종하는 것입니다. 오늘도 흔들리는 마음을 주님께 드리며 온전히 따르는 한 사람이 되어 보세요.\",\"question\":\"오늘 내가 사람들의 시선보다 하나님의 말씀을 따라 선택해야 할 일은 무엇인가요?\",\"prayer\":\"신실하신 주님, 상황과 사람의 말에 흔들리지 않고 갈렙처럼 주님을 온전히 신뢰하며 따르게 해 주세요.\"},\"media_url\":null,\"media_type\":null,\"is_featured\":false,\"sort_order\":0,\"published_at\":\"2026-08-02T00:00:00+09:00\",\"updated_at\":\"2026-08-02T00:00:00+09:00\"},{\"id\":\"default-daily-word-2026-08-01\",\"content_type\":\"daily_word\",\"slug\":\"daily-word-2026-08-01\",\"title\":\"내 손에 있는 작은 것을 주님께 드릴 때\",\"content_date\":\"2026-08-01\",\"status\":\"published\",\"data\":{\"date\":\"2026. 08. 01. 토요일\",\"passage\":\"요한복음 6장 9절\",\"verse\":\"여기 한 아이가 있어 보리떡 다섯 개와 물고기 두 마리를 가지고 있나이다.\",\"title\":\"내 손에 있는 작은 것을 주님께 드릴 때\",\"meditation\":\"하나님은 우리가 얼마나 많이 가졌는지를 먼저 묻지 않으십니다. 지금 내 손에 있는 작은 시간과 따뜻한 말 한마디를 기쁨으로 드리는 마음을 보십니다.\",\"question\":\"내가 오늘 기쁨으로 나눌 수 있는 한 가지는 무엇인가요?\",\"prayer\":\"사랑의 주님, 제가 가진 것이 작다고 주저하지 않게 하시고 기쁨으로 내어놓는 믿음을 주세요.\"},\"media_url\":null,\"media_type\":null,\"is_featured\":false,\"sort_order\":0,\"published_at\":\"2026-08-01T00:00:00+09:00\",\"updated_at\":\"2026-08-01T00:00:00+09:00\"}],\"initialNewsItems\":[],\"supabaseUrl\":\"https://sbylghthpkkwivolhjcz.supabase.co\",\"supabasePublishableKey\":\"sb_publishable_GIX0l-omcNIGk_OFHHeC5Q_Y8w1xn3Z\"}]\n")</script><script>self.__VINEXT_RSC_DONE__=true</script>
